<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050A1A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200,150)">
    <!-- Placa Pi 4 esquemática -->
    <rect x="-90" y="-55" width="180" height="110" rx="8" fill="#0F1B36" stroke="url(#cyan)" stroke-width="2"/>
    <rect x="-70" y="-35" width="50" height="50" rx="4" fill="#1a2a4a" stroke="#29B6F6" stroke-width="1"/>
    <text x="-45" y="-2" text-anchor="middle" fill="#29B6F6" font-family="monospace" font-size="10" font-weight="bold">CPU</text>
    <rect x="-10" y="-35" width="20" height="10" rx="2" fill="#29B6F6"/>
    <rect x="15" y="-35" width="20" height="10" rx="2" fill="#29B6F6"/>
    <rect x="50" y="-35" width="30" height="20" rx="2" fill="#0F1B36" stroke="#29B6F6"/>
    <circle cx="-65" cy="35" r="3" fill="#29B6F6"/>
    <circle cx="-50" cy="35" r="3" fill="#29B6F6"/>
    <circle cx="65" cy="35" r="3" fill="#29B6F6"/>
    <circle cx="80" cy="35" r="3" fill="#29B6F6"/>
    <!-- GPIO pins -->
    <g fill="#29B6F6">
      <rect x="-85" y="-20" width="2" height="3"/>
      <rect x="-80" y="-20" width="2" height="3"/>
      <rect x="-75" y="-20" width="2" height="3"/>
      <rect x="-70" y="-20" width="2" height="3"/>
      <rect x="-65" y="-20" width="2" height="3"/>
    </g>
  </g>
  <text x="200" y="260" text-anchor="middle" fill="#29B6F6" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" letter-spacing="2">RASPBERRY PI 4</text>
</svg>

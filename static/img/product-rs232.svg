<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050A1A"/>
    </linearGradient>
    <linearGradient id="cyanr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgr)"/>
  <g transform="translate(200,150)">
    <!-- USB end -->
    <rect x="-90" y="-12" width="40" height="24" rx="2" fill="#1a2a4a" stroke="url(#cyanr)" stroke-width="2"/>
    <rect x="-85" y="-8" width="30" height="16" fill="#0F1B36"/>
    <!-- Cable -->
    <path d="M -50 0 Q -20 0 -20 0" stroke="url(#cyanr)" stroke-width="6" fill="none"/>
    <line x1="-50" y1="-3" x2="-15" y2="-3" stroke="#29B6F6" stroke-width="1.5"/>
    <line x1="-50" y1="3" x2="-15" y2="3" stroke="#29B6F6" stroke-width="1.5"/>
    <!-- DB9 connector -->
    <path d="M -20 -25 L 20 -25 L 20 -25 Q 30 -25 30 -15 L 30 15 Q 30 25 20 25 L -20 25 Z"
          fill="#0F1B36" stroke="url(#cyanr)" stroke-width="2"/>
    <text x="10" y="6" text-anchor="middle" fill="#29B6F6" font-family="monospace" font-size="10" font-weight="bold">DB9</text>
    <!-- Pins -->
    <g fill="#29B6F6">
      <circle cx="-12" cy="-12" r="2"/>
      <circle cx="-2" cy="-12" r="2"/>
      <circle cx="8" cy="-12" r="2"/>
      <circle cx="18" cy="-12" r="2"/>
      <circle cx="-7" cy="0" r="2"/>
      <circle cx="3" cy="0" r="2"/>
      <circle cx="13" cy="0" r="2"/>
      <circle cx="-2" cy="12" r="2"/>
      <circle cx="8" cy="12" r="2"/>
    </g>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#29B6F6" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" letter-spacing="2">USB ↔ RS232</text>
</svg>

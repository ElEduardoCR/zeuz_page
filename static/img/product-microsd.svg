<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1428"/>
      <stop offset="100%" stop-color="#050A1A"/>
    </linearGradient>
    <linearGradient id="cyanm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgm)"/>
  <g transform="translate(200,150) rotate(-20)">
    <!-- MicroSD body -->
    <path d="M -60 -40 L 60 -40 L 70 -30 L 70 40 L -60 40 Z" fill="#1a2a4a" stroke="url(#cyanm)" stroke-width="2.5"/>
    <!-- Contact pads -->
    <g fill="#29B6F6">
      <rect x="-50" y="20" width="8" height="12" rx="1"/>
      <rect x="-38" y="20" width="8" height="12" rx="1"/>
      <rect x="-26" y="20" width="8" height="12" rx="1"/>
      <rect x="-14" y="20" width="8" height="12" rx="1"/>
      <rect x="-2" y="20" width="8" height="12" rx="1"/>
      <rect x="10" y="20" width="8" height="12" rx="1"/>
      <rect x="22" y="20" width="8" height="12" rx="1"/>
      <rect x="34" y="20" width="8" height="12" rx="1"/>
    </g>
    <!-- Label area -->
    <rect x="-50" y="-30" width="100" height="40" rx="3" fill="#0F1B36" stroke="#29B6F6" stroke-width="1"/>
    <text x="0" y="-10" text-anchor="middle" fill="#29B6F6" font-family="Orbitron, sans-serif" font-size="11" font-weight="700">ZEUZ</text>
    <text x="0" y="3" text-anchor="middle" fill="#90CAF9" font-family="Orbitron, sans-serif" font-size="7" letter-spacing="1.5">32GB · UHS-I</text>
  </g>
  <text x="200" y="270" text-anchor="middle" fill="#29B6F6" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" letter-spacing="2">MICROSD 32GB</text>
</svg>
